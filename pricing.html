<!DOCTYPE html>
<html data-theme="dark">
<head>
    <title>Pricing</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>body{background:#0d1117;color:#c9d1d9}</style>
</head>
<body>
<main class="container">
    <h2>Buy Credits</h2>
    <p>Credits Left: {{ credits }}</p>
    <form action="/pay" method="post">
        <button name="plan" value="500">500 Credits - ₦7,000</button>
        <button name="plan" value="1000">1000 Credits - ₦50,000</button>
        <button name="plan" value="10000">10000 Credits - ₦75,000</button>
        <button name="plan" value="20000">20000 Credits - ₦150,000</button>
    </form>
    <small>4 Methods: Card, Transfer, Bank, USSD</small>
</main>
</body>
</html>
